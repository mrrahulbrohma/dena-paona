name: APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk "DENA-PAONA-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DENA-PAONA ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          body: |
            Automated debug APK build for testing.

            **This is a debug/testing APK, not a production Play Store release.**
            Do not disable Play Protect to install it.
          files: DENA-PAONA-*-debug.apk
